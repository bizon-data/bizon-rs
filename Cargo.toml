[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.87"
publish = false
license = "GPL-3.0-only"
authors = ["Anas El Mhamdi <anas.elmhamdi@gmail.com>"]
repository = "https://github.com/bizon-data/bizon-rs"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
gcp_auth = "0.12"
base64 = "0.22"
percent-encoding = "2"
rdkafka = { version = "0.37", default-features = false, features = ["tokio", "ssl-vendored", "libz-static", "zstd"] }
ryu = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_yaml = "0.9"
prost = "0.13"
prost-types = "0.13"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tokio-stream = "0.1"
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost", "tls", "tls-webpki-roots"] }
tonic-build = "0.12"
protoc-bin-vendored = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
