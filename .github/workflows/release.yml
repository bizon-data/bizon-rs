name: Release

# On a v* tag: build linux binaries for x86_64 and aarch64 on native runners, inside rust:bookworm so they run on
# Debian 12, attach them to a GitHub release, and publish a multi-arch image to GHCR.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - {arch: amd64, target: x86_64-unknown-linux-gnu, runner: ubuntu-latest}
          - {arch: arm64, target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    container: rust:1.87-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the crate version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/bizon-stream/Cargo.toml | head -1)
          [ "v${VERSION}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != crate version ${VERSION}" >&2; exit 1; }
      - run: cargo build --release --locked -p bizon-stream
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.arch }}
          cp target/release/bizon-stream dist/${{ matrix.arch }}/
          ./target/release/bizon-stream --version
          tar -czf bizon-stream-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz -C dist/${{ matrix.arch }} bizon-stream
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch }}/bizon-stream
            bizon-stream-*.tar.gz

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Arrange binaries
        run: |
          for arch in amd64 arm64; do mkdir -p dist/$arch && cp artifacts/$arch/dist/$arch/bizon-stream dist/$arch/; done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/bizon-stream-*.tar.gz
          generate_release_notes: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker buildx build --platform linux/amd64,linux/arm64 -f docker/Dockerfile.release \
            -t "$IMAGE:${GITHUB_REF_NAME#v}" -t "$IMAGE:latest" --push .
